# cert-manager Dashboard NGINX Configuration
# Takes from Mozilla Guideline v5.7, nginx 1.27.3, OpenSSL 3.4.0, intermediate config, no OCSP
# https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=intermediate&openssl=3.4.0&ocsp=false&guideline=5.7

upstream cert-manager-dashboard {
	server [::1]:49984;
}

server {
	# This will need to change if you're hosting elsewhere
	server_name cert-manager-dashboard.sgtcodfish.com;

	listen 443 ssl;
	listen [::]:443 ssl;

	# http2 isn't supported in NGINX as packaged with Debian Bookworm
	# http2 on;

	proxy_http_version 1.1;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ecdh_curve X25519:prime256v1:secp384r1;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers off;

	ssl_session_timeout 1d;
	ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions

	ssl_certificate /etc/ssl/fullchain.pem;
	ssl_certificate_key /etc/ssl/privkey.pem;

	# curl https://ssl-config.mozilla.org/ffdhe2048.txt > /etc/ssl/dhparam.pem
	ssl_dhparam /etc/ssl/dhparam.pem;

	server_tokens off;

	proxy_set_header X-Forwarded-For $remote_addr;

	location / {
		proxy_pass http://cert-manager-dashboard;
	}
}


